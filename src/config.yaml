site:
  name: Nova Inteligencia Group
  site: 'https://novainteligenciagroup.ma'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Métadonnées SEO par défaut
metadata:
  title:
    default: Nova Inteligencia Group — Formation intelligence artificielle à Casablanca
    template: '%s | Nova Inteligencia Group'
  description: "Centre de formation en intelligence artificielle à Casablanca, Maroc : formations IA, ChatGPT, automatisation et stratégie digitale pour professionnels et entreprises."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Nova Inteligencia Group
    locale: fr_MA
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website

i18n:
  language: fr
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 9

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'categorie'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: null # ou "G-XXXXXXXXXX"

ui:
  theme: 'light:only'
